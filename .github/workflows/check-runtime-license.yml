name: Check Runtime License Headers

on:
  pull_request:
    branches:
      - master

jobs:
  check-runtime-license:
    name: Runtime license headers
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'recursive'

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Check runtime mark present in SimulationRuntime source files
        run: |
          python3 .CI/scripts/check_runtime_license.py \
            --summary                                  \
            OMCompiler                                 \
            OMEdit                                     \
            OMNotebook                                 \
            OMOptim                                    \
            OMParser                                   \
            OMPlot                                     \
            OMSens_Qt                                  \
            OMShell                                    \
            OMSimulator
