[package]
name = "openmodelica_script_util"
version = "0.1.0"
edition = "2024"

[dependencies]
openmodelica_wasi.workspace = true
openmodelica_mat_reader.workspace = true
openmodelica_result_files.workspace = true
openmodelica_arrow_writer.workspace = true
openmodelica_error.workspace = true
metamodelica.workspace = true
openmodelica_ast.workspace = true
openmodelica_frontend_types.workspace = true
openmodelica_frontend_dump.workspace = true
openmodelica_util.workspace = true
openmodelica_util_datatypes_basic.workspace = true
const-str.workspace = true
arcstr.workspace = true
loop_unwrap.workspace = true
match_deref.workspace = true
openmodelica_zip.workspace = true
openmodelica_download.workspace = true

[features]
# Downloads (installPackage, updatePackageIndex) over libcurl. On by default;
# without it Curl falls back to the stub that only reports a file already on
# disk, and the build needs neither libcurl nor its TLS/LDAP/SSH dependencies.
default = ["curl"]
curl = ["openmodelica_download/curl"]
