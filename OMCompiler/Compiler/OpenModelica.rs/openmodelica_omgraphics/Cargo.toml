[package]
name = "openmodelica_omgraphics"
version = "0.1.0"
edition = "2024"

[dependencies]
metamodelica.workspace = true
openmodelica_util.workspace = true
# Writes the PNG bytes; routes through the VFS on wasm.
openmodelica_wasi.workspace = true
arcstr.workspace = true
# Renders the icon SVG to PNG: with the system fonts, or on the web with the
# fonts the host serves (wasm_api.rs).
resvg = { version = "0.50", default-features = false, features = ["text", "raster-images"] }
# Measures text in the font resvg draws it with; the version usvg uses.
skrifa = "0.49"
base64 = "0.23"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
resvg = { version = "0.50", default-features = false, features = ["system-fonts", "memmap-fonts"] }
