[package]
name = "openmodelica_omgraphics"
version = "0.1.0"
edition = "2024"

[dependencies]
metamodelica.workspace = true
openmodelica_util.workspace = true
# Writes the PNG bytes; routes through the VFS on wasm.
openmodelica_wasi.workspace = true
arcstr.workspace = true
# PNG IDAT + chunk CRC-32, replacing the C++ renderer's compress2/crc32.
# rust_backend is pure Rust, so it builds for wasm too.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
