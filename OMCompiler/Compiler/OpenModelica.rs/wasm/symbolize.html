<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OpenModelica — wasm stack</title>
<link rel="stylesheet" href="theme.css" />
<style>
  body { overflow-y: auto; padding: 16px; height: auto; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 12px; }
  #status.err { color: var(--err); }
  table { border-collapse: collapse; font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  th, td { text-align: left; padding: 2px 10px 2px 0; vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  td.n { text-align: right; }
  td.name { word-break: break-all; }
  textarea { width: 100%; height: 12em; margin-top: 16px; background: var(--field); color: var(--fg);
    border: 1px solid var(--border); font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
</style>
</head>
<body>
  <h1>WebAssembly stack</h1>
  <p id="status">Loading the function names…</p>
  <table id="frames" hidden>
    <thead><tr><th>Frames</th><th>Function</th><th>Offsets</th><th>Name</th></tr></thead>
    <tbody></tbody>
  </table>
  <textarea id="text" readonly hidden></textarea>

<script type="module">
import { cleanName } from './wasm-stack.js';

// The fragment is written by wasm-stack.js: comma-separated items, innermost
// first. A run is `index@offset[*n]...`, a repeated cycle `(run;run...)*r`,
// and `~` marks dropped middle items.
function parseRun(tok) {
  const [index, ...offs] = tok.split('@');
  const offsets = offs.map((o) => {
    const [offset, n] = o.split('*');
    return { offset, n: Number(n || 1) };
  });
  return { index, offsets, count: offsets.reduce((s, o) => s + o.n, 0) };
}
const items = location.hash.slice(1).split(',').filter(Boolean).map((tok) => {
  if (tok === '~') return { gap: true };
  const m = /^\((.*)\)\*(\d+)$/.exec(tok);
  return m ? { repeat: Number(m[2]), runs: m[1].split(';').map(parseRun) } : { repeat: 0, runs: [parseRun(tok)] };
});

const status = document.getElementById('status');
const fail = (msg) => { status.textContent = msg; status.className = 'err'; };

async function symbolNames(needed) {
  const r = await fetch('omc/OpenModelicaCompiler_bg.symbols');
  if (!r.ok) throw new Error(`no symbol map (HTTP ${r.status}); this build was made without wasm-opt, so its errors already carry the names`);
  const names = new Map();
  for (const line of (await r.text()).split('\n')) {
    const i = line.indexOf(':');
    const index = line.slice(0, i);
    if (!needed.has(index)) continue;
    // wasm-opt writes punctuation as hex escapes, e.g. `\5b` for `[`.
    const name = line.slice(i + 1).replace(/\\([0-9a-f]{2})/g, (_, h) => String.fromCharCode(parseInt(h, 16)));
    names.set(index, cleanName(name));
  }
  return names;
}

function addRow(tbody, cells) {
  const tr = tbody.insertRow();
  for (const [text, cls] of cells) {
    const td = tr.insertCell();
    td.textContent = text;
    td.className = cls;
  }
}

if (!items.length) {
  fail('No stack in the link.');
} else {
  try {
    const names = await symbolNames(new Set(items.flatMap((it) => (it.runs || []).map((r) => r.index))));
    const tbody = document.querySelector('#frames tbody');
    const lines = [];
    for (const it of items) {
      if (it.gap) {
        addRow(tbody, [['…', 'n']]);
        lines.push('...');
        continue;
      }
      const indent = it.repeat ? '  ' : '';
      if (it.repeat) {
        addRow(tbody, [[`${it.repeat} ×`, 'n'], ['', ''], ['', ''], ['the cycle below', 'name']]);
        lines.push(`${it.repeat} times:`);
      }
      for (const run of it.runs) {
        const name = names.get(run.index) || '?';
        const offsets = run.offsets.map((o) => '0x' + o.offset + (o.n > 1 ? ` ×${o.n}` : '')).join(', ');
        addRow(tbody, [[run.count, 'n'], [run.index, 'n'], [offsets, ''], [indent + name, 'name']]);
        lines.push(`${indent}${String(run.count).padStart(6)}  ${name}  (${run.index}: ${offsets})`);
      }
    }
    status.textContent = 'Innermost frame first. Copy the text below into a bug report.';
    document.getElementById('frames').hidden = false;
    const text = document.getElementById('text');
    text.value = lines.join('\n');
    text.hidden = false;
  } catch (e) {
    fail('Could not look up the function names: ' + (e && e.message || e));
  }
}
</script>
</body>
</html>
