# The simulation algorithms that do not depend on where the model comes from:
# the gbode Runge-Kutta family, the fixed-step solvers, the SUNDIALS bindings,
# the simulation flags and the log formatting. A model is anything implementing
# [`Ode`] — the wasm-jit runtime's linear-memory model (openmodelica_sim_meta)
# or an imported FMU (openmodelica_fmi_driver) — so both drive the same solvers,
# and a wasm build of either compiles these once.
[package]
name = "openmodelica_solvers"
version = "0.1.0"
edition = "2024"

[features]
default = ["std"]
std = ["daskr/std"]
# Compile the CVODE/IDA bindings without linking an archive: the symbols stay
# undefined and become wasm imports the FMI3 adapter resolves at FMU-link time.
sundials_extern = []

[dependencies]
# LINPACK's `dgefa`/`dgesl` for gbode's Newton matrix.
daskr = { path = "../daskr", default-features = false }
# no_std `sqrt`/`pow`/`log` for the solver math; unused under `std`.
libm = "0.2"
