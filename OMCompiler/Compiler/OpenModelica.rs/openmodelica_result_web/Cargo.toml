# The OMPlot web page's module: result files as bytes in, trajectories, the
# diffSimulationResults comparison, and .mat/.csv out. wasm-bindgen'd into web/omplot/.
[package]
name = "openmodelica_result_web"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
openmodelica_result_files.workspace = true
openmodelica_mat_writer.workspace = true
openmodelica_wasi.workspace = true
wasm-bindgen = "=0.2.125"
