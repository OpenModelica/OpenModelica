# The master algorithm for imported FMUs: Model Exchange integrated here,
# Co-Simulation advanced by the FMU with early return around its events. The FMI
# 3.0 API is a trait, so the same masters drive an FMU whatever serves it — a
# native shared library through FFI, or a wasm FMU linked into the same module.
#
# The integrators come from `openmodelica_solvers`, the same ones a compiled
# OpenModelica model runs under, so an FMU and a model integrate identically.
[package]
name = "openmodelica_fmi_driver"
version = "0.1.0"
edition = "2024"

[features]
default = ["ffi"]
# Load a native FMU binary and call the FMI 3.0 C API through it (`dlopen`).
# Not available on wasm, where there is nothing to dlopen.
ffi = ["dep:libloading"]

[dependencies]
openmodelica_fmi = { path = "../openmodelica_fmi" }
openmodelica_solvers = { path = "../openmodelica_solvers" }
# The result file: the same `.mat` a simulated model writes, so OMPlot and
# omc-diff read an FMU run like any other.
openmodelica_mat_writer = { path = "../openmodelica_mat_writer" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libloading = { version = "0.8", optional = true }
