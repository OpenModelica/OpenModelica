# The master algorithm for imported FMUs: Model Exchange integrated here,
# Co-Simulation advanced by the FMU with early return around its events. The FMI
# 3.0 API is a trait, so the same masters drive an FMU whatever serves it — a
# native shared library through FFI, or a wasm FMU linked into the same module.
#
# The integrators come from `openmodelica_solvers`, the same ones a compiled
# OpenModelica model runs under, so an FMU and a model integrate identically.
[package]
name = "openmodelica_fmi_driver"
version = "0.1.0"
edition = "2024"

[features]
default = ["ffi"]
# Load a native FMU binary and call the FMI 3.0 C API through it (`dlopen`).
# Not available on wasm, where there is nothing to dlopen.
ffi = ["dep:libloading"]
# Drive an fmi-ls-wasm component in this process: wasmtime instantiates it and
# the masters reach the FMU through its exports. What lets omc simulate the
# artifact it exported without a loader library in between.
component = ["dep:wasmtime", "dep:wasmtime-wasi", "dep:openmodelica_ext_native"]

[dependencies]
openmodelica_fmi = { path = "../openmodelica_fmi" }
openmodelica_solvers = { path = "../../../SimulationRuntime/rust/openmodelica_solvers" }
# The result file: the same `.mat` a simulated model writes, so OMPlot and
# omc-diff read an FMU run like any other.
openmodelica_mat_writer = { path = "../../../SimulationRuntime/rust/openmodelica_mat_writer" }
# The Arrow result file, which keeps the column types, the discrete-time encoding
# and the FMU's own unit definitions that a `.mat` has nowhere to put.
openmodelica_arrow_writer = { path = "../../../SimulationRuntime/rust/openmodelica_arrow_writer" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libloading = { version = "0.8", optional = true }
# The same wasmtime the wasm-jit engine and the FMU exporter use: a `.cwasm` is
# tied to one build and one configuration, so there can only be one.
wasmtime = { workspace = true, optional = true, features = ["component-model", "gc", "gc-null", "gc-drc"] }
# An FMU whose model has `external "C"` reaches libc, and libc imports WASI.
wasmtime-wasi = { version = "45", default-features = false, optional = true, features = ["p2"] }
openmodelica_ext_native = { path = "../openmodelica_ext_native", optional = true }
