# The LAPACK every OpenModelica target uses: omc's own `Modelica.Math.Matrices.*`
# evaluation (`openmodelica_util::Lapack`, in place of a system liblapack), the
# wasm-jit runtime's dense solve, and `liblapack.wasm` for `external "FORTRAN 77"`
# inside a wasm FMU.
#
# Every routine is a port of the reference LAPACK kernel: the packed factors and
# the `INFO` convention are load-bearing (MSL reads both), which no
# decomposition-shaped crate API can express. See `src/lib.rs`.
[package]
name = "openmodelica_lapack"
version = "0.1.0"
edition = "2024"

[features]
# faer's decompositions instead of the ports here, wherever faer has one and the
# problem is big enough (see `FAER_LU_MIN`). On by default: it is faster, it is
# what the QZ routines (`dggev`, `dhgeqz`) and `dtrevc` need at all, and the ports
# it replaces stay compiled as `*_ref` so `--no-default-features` still builds a
# faer-free crate.
default = ["faer-backend"]
# `extern "C"` entry points with LAPACK's Fortran ABI (`dgesv_(&n, …)`), for the
# `liblapack.wasm` side module a generated module's `external "FORTRAN 77"` calls
# bind to. Off for the rlib consumers, which call the Rust API directly.
fortran-abi = []
# `tests/vs_reference.rs`, which needs a system `liblapack.so`. Must not be
# combined with `fortran-abi`: both define the `d*_` symbols.
reference-lapack = []
# The faer port: `dgetrf`, `dpotrf`, `dgesvd`, `dgeev`, `dhseqr` over faer's
# decompositions. The ports stay compiled as `*_ref`, which the LU pair still
# takes for a small matrix.
faer-backend = ["dep:faer"]

[dependencies]
libm = "0.2"
# `~0.24.4`, not `0.24`: `src/faer_real_schur.rs` is a vendored copy of faer's
# own `real_schur.rs` (faer keeps it `pub(crate)`), so it is tied to internals a
# minor bump may move. A patch bump is fine; a minor one means re-running
# `vendor-faer-real-schur.sh`.
faer = { version = "~0.24.4", default-features = false, features = ["linalg", "std"], optional = true }

[lib]
# `cdylib` for the `liblapack.wasm` side module, `rlib` for openmodelica_util.
crate-type = ["cdylib", "rlib"]

[profile.release]
# Speed over size: these are the routines a model's LAPACK calls land in, and the
# module is only linked into an FMU that actually uses them. `strip` because the
# side module carries no debugger.
opt-level = 3
lto = true
strip = true

[workspace]
