# libomc_result: the C ABI (include/omc_result.h, with a header-only C++
# wrapper) over the result-file readers, for OMEdit and OMPlot, and the result
# writers for the C simulation runtime. rlib too, so the runtime root can
# depend on it and `cargo build -p openmodelica_result_capi` works on stable.
[package]
name = "openmodelica_result_capi"
version = "0.1.0"
edition = "2024"
workspace = "../../../Compiler/OpenModelica.rs"

[lib]
name = "omc_result"
crate-type = ["rlib", "cdylib"]

[dependencies]
openmodelica_result_files = { path = "../openmodelica_result_files" }
openmodelica_arrow_writer = { path = "../openmodelica_arrow_writer" }
openmodelica_mat_writer = { path = "../openmodelica_mat_writer" }
openmodelica_plt_writer = { path = "../openmodelica_plt_writer" }
libc = "0.2"
