# Apache Arrow IPC (`.arrow`) result-file writer. Like `openmodelica_mat_writer`
# it writes bytes into a caller-owned sink and does no I/O of its own.
[package]
name = "openmodelica_arrow_writer"
version = "0.1.0"
edition = "2024"
workspace = "../../../Compiler/OpenModelica.rs"

[lib]

[dependencies]
arrow-array = { version = "59", default-features = false }
arrow-schema = { version = "59", default-features = false }
arrow-ipc = { version = "59", default-features = false }

# The examples write a compressed stream; the library itself never compresses,
# so the codec stays out of a normal build (and out of the wasm runtime).
[dev-dependencies]
arrow-ipc = { version = "59", default-features = false, features = ["zstd"] }
