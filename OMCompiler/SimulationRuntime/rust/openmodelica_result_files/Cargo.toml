# Result files without the compiler: the readers, the diffSimulationResults
# tube comparison and `ResultFile`, shared by the scripting API, the OMPlot web
# module, `omplot` and the omc_result C ABI. Explicit dependencies (no
# workspace inheritance), so it builds on stable from the runtime workspace.
[package]
name = "openmodelica_result_files"
version = "0.1.0"
edition = "2024"
workspace = "../../../Compiler/OpenModelica.rs"

[dependencies]
openmodelica_result_diff = { path = "../openmodelica_result_diff" }
openmodelica_mat_reader = { path = "../openmodelica_mat_reader", default-features = false }
openmodelica_arrow_writer = { path = "../openmodelica_arrow_writer" }
openmodelica_mat_writer = { path = "../openmodelica_mat_writer" }
openmodelica_hdf5_result = { path = "../openmodelica_hdf5_result", optional = true }
arrow-array = { version = "59", default-features = false }
arrow-schema = { version = "59", default-features = false }
arrow-ipc = { version = "59", default-features = false }
serde_json = "1"

[features]
default = ["vfs"]
# The in-memory filesystem the wasm targets need, through
# `openmodelica_mat_reader::fs`. On by default; a native-only consumer can opt
# out with `default-features = false`.
vfs = ["openmodelica_mat_reader/vfs"]
# SDF and MTSF, i.e. the readers that need the HDF5 C library.
hdf5 = ["dep:openmodelica_hdf5_result", "openmodelica_hdf5_result/library"]
static-hdf5 = ["hdf5", "openmodelica_hdf5_result/static-hdf5"]
# The pre-`arrow.modelica` layout's reader, for the result-format benchmark
# only. Nothing in OpenModelica should enable this.
json-layout = ["openmodelica_arrow_writer/json-layout"]
