# Ptolemy (`.plt`) result-file writer for the wasm-jit simulation target.
# `no_std` + `alloc`, no wasm intrinsics and no I/O — it produces the file bytes
# as a `Vec<u8>` and the caller writes them. So one implementation is shared by
# the host (which writes the bytes to the VFS / disk) and the standalone
# `wasm32-wasip1` runtime's `_start` (which writes them via WASI), with no risk of
# the two `.plt` serializers drifting apart. Builds for the host, wasm32-unknown
# and wasm32-wasip1 alike.
[package]
name = "openmodelica_plt_writer"
version = "0.1.0"
edition = "2024"
workspace = "../../../Compiler/OpenModelica.rs"

[lib]

[dependencies]
# no_std `log10`/`floor`/`pow`/`fabs` for the C `%.16g` number formatting;
# unused under `std` (inherent methods).
libm = "0.2"
