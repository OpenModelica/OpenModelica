# Reading and writing the four result formats, measured against each other:
# OpenModelica MATLAB v4, `arrow.modelica`, SDF and MTSF.
#
# Its own `[workspace]`, so neither `cargo build --workspace` in the compiler
# tree nor the runtime workspace pulls HDF5 into a normal build. Build it as
#
#     cargo run --release --manifest-path .../openmodelica_result_bench/Cargo.toml -- --data <dir>
[package]
name = "openmodelica_result_bench"
version = "0.1.0"
edition = "2024"

[dependencies]
openmodelica_mat_reader = { path = "../openmodelica_mat_reader" }
openmodelica_mat_writer = { path = "../openmodelica_mat_writer" }
openmodelica_arrow_writer = { path = "../openmodelica_arrow_writer" }
openmodelica_hdf5_result = { path = "../openmodelica_hdf5_result", features = ["library"] }
openmodelica_result_files = { path = "../openmodelica_result_files", features = ["hdf5"] }
arrow-array = { version = "59", default-features = false }
# The fifth format: an Arrow IPC file written through minarrow rather than
# arrow-rs. Optional because it drags in tokio and needs a nightly rustc.
minarrow = { version = "0.17", optional = true }
lightstream = { version = "0.6", optional = true }
arrow-ipc = { version = "59", default-features = false, features = ["lz4", "zstd"] }
arrow-schema = { version = "59", default-features = false }
arrow-buffer = { version = "59", default-features = false }
flatbuffers = "25.2"
zstd = "0.13"
libc = "0.2"

[features]
default = []
# Measure `arrow.minarrow` beside the four: the same Arrow IPC file written and
# read through minarrow + lightstream instead of arrow-rs.
minarrow = ["dep:minarrow", "dep:lightstream"]
# Take HDF5 from the `hdf5-metno-src` crate instead of the system library.
static-hdf5 = ["openmodelica_hdf5_result/static-hdf5", "openmodelica_result_files/static-hdf5"]

[profile.release]
debug = true

[workspace]
exclude = [
  "../openmodelica_mat_reader",
  "../openmodelica_mat_writer",
  "../openmodelica_arrow_writer",
  "../openmodelica_hdf5_result",
  "../openmodelica_result_files",
  "../../../Compiler/OpenModelica.rs/openmodelica_wasi",
]
