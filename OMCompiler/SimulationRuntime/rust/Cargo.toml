# Builds libSimulationRuntimeRust without the compiler.
#
# The crates below are members of the compiler workspace, so that an omc build
# compiles each of them exactly once -- the wasm-jit target shares the driver,
# the integrators and the result writers. That workspace cannot be loaded from a
# clean checkout, though: most of its members only get a src/lib.rs once mmtorust
# has run. So this is a second workspace, reaching them as ordinary path
# dependencies, which cargo resolves without loading their own workspace root:
#
#   cargo check                                  # the whole runtime
#   cargo build --release -p openmodelica_simulation_runtime
#
# both work here on a pristine checkout. `exclude` is required -- without it
# cargo claims the crates under this root as members and rejects them as
# belonging to the wrong workspace.
[package]
name = "openmodelica_simulation_runtime_standalone"
version = "0.1.0"
edition = "2024"

[dependencies]
openmodelica_simulation_runtime = { path = "openmodelica_simulation_runtime" }
# The result-file reader library for OMEdit/OMPlot (cargo build -p openmodelica_result_capi).
openmodelica_result_capi = { path = "openmodelica_result_capi" }

# The browser module the OMPlot page and modelica-result-compare's reports use:
#   cargo build -p openmodelica_result_web --release --target wasm32-unknown-unknown
# Reached from *this* root, not from its own manifest -- that one points at the
# compiler workspace, which a pristine checkout cannot load. Target-gated so a
# native build of the runtime does not compile wasm-bindgen for the host.
[target.'cfg(target_arch = "wasm32")'.dependencies]
openmodelica_result_web = { path = "openmodelica_result_web" }

# openmodelica_result_web_embed packages that module for a host consumer. Its own
# workspace root, and deliberately not a dependency here: its build.rs runs the
# whole wasm build, which a `cargo check` of the runtime has no use for.
#   cargo run --release --manifest-path openmodelica_result_web_embed/Cargo.toml \
#             --bin install-result-web -- DIR

[workspace]
exclude = [
  "daskr",
  "minpack",
  "openmodelica_mat_reader",
  "openmodelica_mat_writer",
  "openmodelica_arrow_writer",
  "openmodelica_hdf5_result",
  "openmodelica_nls",
  "openmodelica_plt_writer",
  "openmodelica_regex",
  "openmodelica_result_capi",
  "openmodelica_result_cli",
  "openmodelica_result_diff",
  "openmodelica_result_files",
  "openmodelica_result_web",
  "openmodelica_result_web_embed",
  "openmodelica_sim_meta",
  "openmodelica_simulation_runtime",
  "openmodelica_solvers",
]
