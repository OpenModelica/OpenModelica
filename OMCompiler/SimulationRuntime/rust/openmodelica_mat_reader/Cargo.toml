# Reader for OpenModelica's MATLAB v4 result files: the compiler's
# `SimulationResults` package (`val`, `readSimulationResult`, ...) and the
# simulation runtimes' `-iif` share it. Only `std` and the fs facade, so a
# simulation executable can depend on it without the compiler stack.
[package]
name = "openmodelica_mat_reader"
version = "0.1.0"
edition = "2024"
workspace = "../../../Compiler/OpenModelica.rs"

[lib]

[dependencies]
openmodelica_wasi = { path = "../../../Compiler/OpenModelica.rs/openmodelica_wasi", optional = true }

[features]
# The in-memory filesystem the wasm targets need; see src/fs.rs. On by default so
# every OpenModelica consumer keeps it, and a native-only one can opt out with
# `default-features = false`.
default = ["vfs"]
vfs = ["dep:openmodelica_wasi"]
