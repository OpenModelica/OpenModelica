# `libSimulationRuntimeRust`: the simulation runtime the C code generator's output
# links against under `--simCodeTarget=C`. The generated sources are byte for
# byte the ones `--simCodeTarget=C.old` produces; only the runtime behind them differs.
#
# Nothing here re-implements a driver or an integrator: those, the event handling
# and the result writers are the same crates the `wasm-jit` target runs
# (`openmodelica_sim_meta`, `openmodelica_solvers`, `openmodelica_mat_writer`).
# What this crate adds is the C ABI: mirrors of `simulation_data.h` (src/abi.rs),
# the region map that lays the driver's flat `SimData` over `DATA`'s own arrays
# (src/data.rs), a `SimEngine` that calls the model through `data->callback`
# (src/engine.rs), the entry points the generated code names (src/run.rs,
# src/support.rs, src/systems.rs, src/operators.rs), and what fills `MODEL_DATA`
# and the driver's model description (src/model_data.rs, src/meta.rs).
[package]
name = "openmodelica_simulation_runtime"
version = "0.1.0"
edition = "2024"
workspace = "../../../Compiler/OpenModelica.rs"

[lib]
name = "SimulationRuntimeRust"
# `rlib` too: the ABI layout test links the mirror, so cargo rebuilds it when
# `src/abi.rs` changes. `staticlib` is what a source-code FMU links: there the C
# half is compiled from the FMU's own sources, so the archive must leave
# libOpenModelicaRuntimeC's symbols undefined rather than bind them.
crate-type = ["cdylib", "rlib", "staticlib"]

[features]
default = ["standalone", "faer"]
# openmodelica_lapack's faer backend: its decompositions in place of the reference
# ports, wherever faer has one. On by default, and the only choice in wasm, which
# has no system LAPACK. A native FMU turns it off -- 2.5 MB of the binary -- and
# falls back to the ports; a model wanting the routines only faer serves
# (`dggev`, `dhgeqz`, `dtrevc`) links the system LAPACK instead.
faer = ["openmodelica_lapack/faer-backend", "openmodelica_nls/faer", "openmodelica_sim_meta/faer"]
# The `d*_` Fortran ABI for the model's own `external "FORTRAN 77"` LAPACK calls
# (`Modelica.Math.Matrices.*`). An executable leaves those to the system
# liblapack -- defining them here would collide with it -- but an FMU has to carry
# them, as a C FMU carries f2c's `dgesv`.
fmu-lapack = ["openmodelica_lapack/fortran-abi"]
# The FMI component: the state machine `openmodelica_fmi3_wasm` also serves the
# wasm FMU with, driven here over `CEngine`. It replaces the C
# `fmi-export/fmu2_model_interface.c`, whose Co-Simulation offers only Euler and
# CVODE where this one has the whole solver set.
fmi = ["dep:openmodelica_fmi3_wasm"]
# The simulation executable's half: the `_main_*` entry points, the result file,
# `-variableFilter`, `-iif` and `-saveInitialGuess_system`. An FMU has none of
# them -- the importer owns the run -- and without it the Arrow, regex and
# mat/plt writer crates leave the archive an FMU links, rather than being dropped
# by the linker afterwards.
standalone = [
    "openmodelica_sim_meta/result-files",
    # The executable links `-llapack`; an FMU links none and keeps the port.
    "openmodelica_nls/system-lapack",
    "dep:openmodelica_mat_writer",
    "dep:openmodelica_plt_writer",
    "dep:openmodelica_mat_reader",
    "dep:openmodelica_regex",
]

[dependencies]
# The driver (`driver::drive`) and the model description it runs on.
openmodelica_sim_meta = { path = "../openmodelica_sim_meta", default-features = false, features = ["std"] }
# The integrators and the `-lv` log formatting they share with the wasm-jit runtime.
openmodelica_solvers = { path = "../openmodelica_solvers" }
# The nonlinear solver they share too: `solve_nonlinear_system` and the ladder
# under it, driven here over `NONLINEAR_SYSTEM_DATA` (src/nls.rs).
openmodelica_nls = { path = "../openmodelica_nls", default-features = false, features = ["std"] }
# The result file.
openmodelica_mat_writer = { path = "../openmodelica_mat_writer", optional = true }
openmodelica_plt_writer = { path = "../openmodelica_plt_writer", optional = true }
# `-iif`: the result file the start values are imported from.
openmodelica_mat_reader = { path = "../openmodelica_mat_reader", optional = true }
# `_init.xml`: the variable names, attributes and start values the generated C
# does not carry (C reads the same file with expat in `simulation_input_xml.c`).
roxmltree = "0.21"
# `<Model>_info.json`: the equation and variable names the generated residuals
# name their iteration variables through (`simulation_info_json.c` reads the same
# file with a hand-rolled scanner).
serde_json = "1"
libc = "0.2"
# `variableFilter`, the same POSIX-over-`regex` the omc builtin and the wasm-jit
# target use -- C compiles it with `regcomp`, which is POSIX-only.
openmodelica_regex = { path = "../openmodelica_regex", optional = true }
# `dgesv` for the dense linear systems -- the same LAPACK the wasm-jit runtime
# factors with, so a system gets the same pivot order and `INFO` either way.
# Without `fortran-abi`: the executable already links the system liblapack, and
# defining `d*_` here would collide with it.
openmodelica_lapack = { path = "../../../Compiler/OpenModelica.rs/openmodelica_lapack", default-features = false }

# The FMI state machine, without its wasm half (see its `wasm` feature).
openmodelica_fmi3_wasm = { path = "../../../Compiler/OpenModelica.rs/openmodelica_fmi3_wasm", default-features = false, features = ["me", "cs"], optional = true }

[build-dependencies]
# Compiles src/shim.c -- the setjmp/longjmp and printf-varargs half of the ABI.
cc = "1"
